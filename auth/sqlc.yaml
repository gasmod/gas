version: "2"
sql:
  #=========================================================#
  #                         SESSION                         #
  #=========================================================#

  - engine: "postgresql"
    schema: "internal/sessionstore/postgres/*.up.sql"
    queries: "internal/sessionstore/postgres/queries.sql"
    gen:
      go:
        package: "pgdb"
        out: "internal/sessionstore/postgres"
        sql_package: "database/sql"
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true

  - engine: "mysql"
    schema: "internal/sessionstore/mysql/*.up.sql"
    queries: "internal/sessionstore/mysql/queries.sql"
    gen:
      go:
        package: "mydb"
        out: "internal/sessionstore/mysql"
        sql_package: "database/sql"
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true

  - engine: "sqlite"
    schema: "internal/sessionstore/sqlite/*.up.sql"
    queries: "internal/sessionstore/sqlite/queries.sql"
    gen:
      go:
        package: "litedb"
        out: "internal/sessionstore/sqlite"
        sql_package: "database/sql"
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        emit_pointers_for_null_types: true

