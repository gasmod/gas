name: Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.2'
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  # Selects the modules this push can affect: those with changed files, plus
  # every module that depends on one of them (see scripts/changed-modules.sh).
  # A branch is compared with its merge base on main, a push to main with the
  # commit it moved from. Release tags run every module (release.yml).
  #
  # The check jobs still run a matrix entry for every module, because the
  # ruleset on main requires each module's check by name. An entry for a
  # module that is not selected skips its steps and passes.
  detect-modules:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.set-modules.outputs.all }}
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - id: set-modules
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            base="$BEFORE"
          else
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi
          modules="$(./scripts/changed-modules.sh "$base")"
          echo "Checking: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "all=$(go list -m -json | jq -sc '[.[].Dir]')" >> "$GITHUB_OUTPUT"

  golangci-lint:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.all) }}
    env:
      SELECTED: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), matrix.modules) }}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
      - uses: actions/setup-go@v7
        if: env.SELECTED == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint ${{ matrix.modules }}
        if: env.SELECTED == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.modules }}

  go-test:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.all) }}
    env:
      SELECTED: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), matrix.modules) }}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
      - uses: actions/setup-go@v7
        if: env.SELECTED == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test ${{ matrix.modules }}
        if: env.SELECTED == 'true'
        run: go test -v -race -short ./...
        working-directory: ${{ matrix.modules }}

  # Runs the storage module's tests on Windows, where the dir backend locks
  # with LockFileEx (lock_win.go) and removes files and directories under
  # Windows sharing rules. It is its own job, not an OS axis on go-test, so
  # the check names the ruleset on main requires stay as they are. Only
  # storage runs: it is the module with Windows-specific code. -race is left
  # to the Linux job. LocalStack tests skip themselves here, since they need
  # a Linux container.
  go-test-windows:
    needs: detect-modules
    runs-on: windows-latest
    env:
      SELECTED: ${{ contains(needs.detect-modules.outputs.modules, '/storage"') }}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
      - uses: actions/setup-go@v7
        if: env.SELECTED == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test storage
        if: env.SELECTED == 'true'
        run: go test -v -short ./...
        working-directory: storage

  go-vet:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.all) }}
    env:
      SELECTED: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), matrix.modules) }}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
      - uses: actions/setup-go@v7
        if: env.SELECTED == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet ${{ matrix.modules }}
        if: env.SELECTED == 'true'
        run: go vet ./...
        working-directory: ${{ matrix.modules }}

  govulncheck:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.all) }}
    env:
      SELECTED: ${{ contains(fromJSON(needs.detect-modules.outputs.modules), matrix.modules) }}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
      - uses: actions/setup-go@v7
        if: env.SELECTED == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck ${{ matrix.modules }}
        if: env.SELECTED == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
        working-directory: ${{ matrix.modules }}
