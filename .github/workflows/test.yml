name: Test

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

# A branch cancels its superseded runs. Each push to main gets its own group,
# so none is cancelled: a concurrency group keeps at most one pending run and
# cancels the older one when another queues, and every run on main checks
# only the modules its own push changed.
concurrency:
  group: test-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # An explicit bash runs with -o pipefail; the default shell does not.
    shell: bash

jobs:
  # Selects the modules this push can affect: those with changed files, plus
  # every module that depends on one of them (see scripts/changed-modules.sh).
  # A branch is compared with its merge base on main, a push to main with the
  # commit it moved from. Release tags run every module (release.yml).
  #
  # The ruleset on main requires this job and checks / gate.
  detect-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: set-modules
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            base="$BEFORE"
          else
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi
          # A failing script fails the step: the assignment takes its status.
          modules="$(./scripts/changed-modules.sh "$base")"
          echo "Checking: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  checks:
    needs: detect-modules
    uses: ./.github/workflows/checks.yml
    with:
      modules: ${{ needs.detect-modules.outputs.modules }}
