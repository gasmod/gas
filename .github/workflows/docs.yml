name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The reference pages are generated from the Go doc, so a Go change
      # can change the site.
      - '**/*.go'
      - 'skills/**'
      - '.github/workflows/docs.yml'
  # Pull requests build and check the site but never deploy it.
  pull_request:
    paths:
      - 'docs/**'
      # The reference pages are generated from the Go doc, so a Go change
      # can change the site.
      - '**/*.go'
      - 'skills/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the skill is current
        # skills/gas is generated from the Go doc and committed; run
        # `make skill` after changing a doc comment or the template.
        run: |
          GOWORK=off go run . -skill ../.. "$RUNNER_TEMP/skill"
          diff -r "$RUNNER_TEMP/skill" ../../skills/gas
        working-directory: docs/gen
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Installs the pnpm version pinned by packageManager.
          package_json_file: docs/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro's engines field requires >= 22.23.4; a bare 22 can resolve
          # to an older Node cached on the runner.
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build site
        # Generates the reference pages from the Go doc, then builds. Fails
        # when a link, including a doc link in a Go comment, does not resolve.
        run: pnpm build
        working-directory: docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN permissions required to deploy to GitHub Pages.
    permissions:
      pages: write
      id-token: write
    # Allow one deployment at a time; do not cancel a run mid-deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
