name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The reference pages are generated from the Go doc, so a Go change
      # can change the site.
      - '**/*.go'
      - '.github/workflows/docs.yml'
  # Pull requests build and check the site but never deploy it.
  pull_request:
    paths:
      - 'docs/**'
      # The reference pages are generated from the Go doc, so a Go change
      # can change the site.
      - '**/*.go'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          # Installs the pnpm version pinned by packageManager.
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          # Astro's engines field requires >= 22.23.4; a bare 22 can resolve
          # to an older Node cached on the runner.
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build site
        # Generates the reference pages from the Go doc, then builds. Fails
        # when a link, including a doc link in a Go comment, does not resolve.
        run: pnpm build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN permissions required to deploy to GitHub Pages.
    permissions:
      pages: write
      id-token: write
    # Allow one deployment at a time; do not cancel a run mid-deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
