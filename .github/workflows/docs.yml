name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'KNOWN_ISSUES.md'
      - '.github/workflows/docs.yml'
  # Pull requests build and check the site but never deploy it.
  pull_request:
    paths:
      - 'docs/**'
      - 'KNOWN_ISSUES.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check claim quotes
        # Every claim test quotes the page it backs; this fails when a quoted
        # claim, its page, or its heading anchor no longer exists.
        run: go test ./claims -run TestQuotes
        working-directory: docs/snippets
      - name: Check known issues page
        # Keeps project/known-issues.mdx in sync with KNOWN_ISSUES.md.
        run: go test ./claims/project-known-issues -run TestPageMatchesKnownIssues
        working-directory: docs/snippets
      - uses: actions/setup-node@v7
        with:
          # Astro's engines field requires >= 22.23.4; a bare 22 can resolve
          # to an older Node cached on the runner.
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: docs
      - name: Build site
        # Fails when a snippet region referenced by a page no longer exists in
        # docs/snippets, or when an internal link does not resolve, so
        # documentation drift breaks the build.
        run: npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN permissions required to deploy to GitHub Pages.
    permissions:
      pages: write
      id-token: write
    # Allow one deployment at a time; do not cancel a run mid-deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
