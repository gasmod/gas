name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    # An explicit bash runs with -o pipefail; the default shell does not.
    shell: bash

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Internal module versions must match ${{ github.ref_name }}
        run: ./scripts/verify-versions.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: set-modules
        run: |
          # No base selects every module.
          modules="$(./scripts/changed-modules.sh "")"
          # The root module and at least one sub-module, or the listing broke.
          if ! jq -e 'index(".") != null and length > 1' <<<"$modules" >/dev/null; then
            echo "::error::unexpected module list: $modules"
            exit 1
          fi
          echo "Releasing: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  checks:
    needs: detect-modules
    uses: ./.github/workflows/checks.yml
    with:
      modules: ${{ needs.detect-modules.outputs.modules }}

  release:
    needs: [ detect-modules, checks ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A module's tag is prefixed with its path relative to the repo root.
      # The root module takes the bare tag, which the triggering push already
      # created. A re-run skips the tags already pushed at this commit and
      # fails on one that points elsewhere.
      - name: Tag the sub-modules
        env:
          MODULES: ${{ needs.detect-modules.outputs.modules }}
        run: |
          head="$(git rev-parse HEAD)"
          # Captured first, so a jq failure fails the step.
          subs="$(jq -r '.[] | select(. != ".")' <<<"$MODULES")"
          if [ -z "$subs" ]; then
            echo "::error::no sub-modules to tag in $MODULES"
            exit 1
          fi
          tags=()
          for m in $subs; do
            tag="$m/$GITHUB_REF_NAME"
            remote="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
            if [ -z "$remote" ]; then
              git tag "$tag"
              tags+=("$tag")
            elif [ "$remote" != "$head" ]; then
              echo "::error::$tag already exists at $remote, not $head"
              exit 1
            fi
          done
          # All the missing sub-module tags land or none do.
          if [ ${#tags[@]} -gt 0 ]; then
            git push --atomic origin "${tags[@]}"
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Release $GITHUB_REF_NAME" --generate-notes
          fi
