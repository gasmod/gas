name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: 1.26
  GOLANGCI_LINT_VERSION: v2.12

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Internal module versions must match ${{ github.ref_name }}
        run: ./scripts/verify-versions.sh "${{ github.ref_name }}"

  detect-modules:
    needs: verify-versions
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - id: set-modules
        run: echo "modules=$(go list -m -json | jq -sc '[.[].Dir] | map(select((contains("example") or contains("docs")) | not))')" >> $GITHUB_OUTPUT

  golangci-lint:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint ${{ matrix.modules }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.modules }}

  go-test:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test ${{ matrix.modules }}
        run: go test -v -race ./...
        working-directory: ${{ matrix.modules }}

  go-vet:
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet ${{ matrix.modules }}
        run: go vet ./...
        working-directory: ${{ matrix.modules }}

  tag:
    needs: [ detect-modules, golangci-lint, go-test, go-vet ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - id: mod
        env:
          MODULE: ${{ matrix.modules }}
        run: |
          # A module's tag is prefixed with its path relative to the repo root.
          # The root module takes a bare tag, which the triggering push already created.
          rel="${MODULE#"$GITHUB_WORKSPACE"}"
          rel="${rel#/}"
          if [ -z "$rel" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "name=$rel" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.mod.outputs.skip == 'false'
        run: |
          git tag "$TAG"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.mod.outputs.name }}/${{ github.ref_name }}

  release:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
