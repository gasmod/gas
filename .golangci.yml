version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  build-tags:
    - e2e

linters:
  enable:
    # Bugs & correctness
    - errcheck
    - govet
    - staticcheck
    - bodyclose
    - nilerr
    - sqlclosecheck
    - contextcheck

    # Style & consistency
    - revive
    - misspell
    - whitespace
    - unconvert
    - predeclared

    # Complexity & maintainability
    - gocyclo
    - gocognit
    - cyclop
    - funlen
    - nestif

    # Performance
    - prealloc
    - gocritic

    # Security
    - gosec

    # Error handling
    - errorlint
    - wrapcheck

    # Architecture
    - depguard

    # Unused code
    - unused
    - unparam
    - wastedassign

  settings:
    govet:
      enable-all: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - (github.com/gasmod/gas.Context).
        - (github.com/gasmod/gas.UIProvider).

    misspell:
      locale: US

    depguard:
      rules:
        internal:
          list-mode: lax
          allow:
            - github.com/gasmod/gas

  exclusions:
    paths:
      - vendor
      - third_party
      - testdata

    rules:
      - path: _test\.go
        linters:
          - revive
          - cyclop
          - funlen
          - wrapcheck

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/gasmod/gas)

output:
  sort-order:
    - linter
    - severity
    - file
