version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  build-tags:
    - e2e

linters:
  default: all
  enable:
    - gomodguard_v2
    - wsl_v5
  disable:
    - exhaustruct_v5
    - exhaustruct
    - gomodguard
    - wsl
    - varnamelen
    - nonamedreturns
    - nilnil
    - ireturn
    - gochecknoglobals

  settings:
    wsl_v5:
      default: all

    govet:
      enable-all: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    wrapcheck:
      ignore-sigs:
        - fmt.Errorf(
        - errors.New(
        - errors.Join(

    depguard:
      rules:
        allow-list:
          list-mode: lax
          allow:
            - github.com/gasmod/gas
            - github.com/go-playground/validator/v10
            - github.com/aws/aws-sdk-go-v2
            - github.com/stretchr/testify/assert
            - github.com/stretchr/testify/require

    misspell:
      locale: US

  exclusions:
    rules:
      - path: \_test\.go
        linters:
          - wrapcheck
          - tagliatelle
          - paralleltest
          - goconst
          - forcetypeassert

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/gasmod/gas)

output:
  sort-order:
    - linter
    - severity
    - file
